name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      ticket_id:
        description: "Notion ticket ID to sync QA result to (leave empty to skip)"
        required: false
        default: ""

jobs:
  validate:
    name: Validate, lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest ruff==0.15.14

      - name: Validate JSON syntax
        run: make validate-json

      - name: Validate ticker referential coherence
        run: make check-referential

      # L'état du référentiel a quitté git (Epic 10 S4) : la CI n'en a plus, donc
      # check-referential n'y a rien à vérifier. C'est la moitié CONFIGURATION qui
      # est désormais gardée ici — un seuil ou un facteur sectoriel altéré rougit.
      - name: Validate referential configuration invariant
        run: make check-config-invariant

      - name: Lint
        run: make lint

      - name: Run tests
        run: make test

      - name: Sync QA result to Notion
        if: always()
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DB_TICKETS_ID: ${{ secrets.NOTION_DB_TICKETS_ID }}
          NOTION_DB_SPECS_ID: ${{ secrets.NOTION_DB_SPECS_ID }}
          TELEGRAM_ORCHESTRATION_BOT_TOKEN: ${{ secrets.TELEGRAM_ORCHESTRATION_BOT_TOKEN }}
          TELEGRAM_ORCHESTRATION_CHAT_ID: ${{ secrets.TELEGRAM_ORCHESTRATION_CHAT_ID }}
        run: |
          # job.status aggregates every preceding verification step (JSON, referential,
          # lint, tests). The former condition only looked at JSON validation, so a run
          # with failing tests reported a green QA verdict to Notion.
          if [ "${{ job.status }}" = "success" ]; then
            CI_PASSED_FLAG="--ci-passed"
            echo "QA verdict: PASS — reporting success to Notion (job.status=${{ job.status }})"
          else
            CI_PASSED_FLAG="--no-ci-passed"
            echo "QA verdict: FAIL — reporting failure to Notion (job.status=${{ job.status }})"
          fi

          # .ticket-id written by the Dispatcher takes precedence over workflow_dispatch input.
          TICKET_ID=$(cat .ticket-id 2>/dev/null || echo "")
          if [ -z "$TICKET_ID" ]; then
            TICKET_ID="${{ inputs.ticket_id }}"
          fi
          if [ -z "$TICKET_ID" ]; then
            echo "No ticket_id found — skipping Notion sync"
            exit 0
          fi

          PR_URL="${{ github.event.pull_request.html_url }}"
          CI_RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BRANCH="${{ github.head_ref || github.ref_name }}"

          pip install "git+https://${{ secrets.GH_PAT }}@github.com/patw47/orchestration.git" --quiet

          if [ "$CI_PASSED_FLAG" = "--no-ci-passed" ]; then
            PR_URL=""
          fi

          python -m orchestration.qa_sync \
            --ticket-id "$TICKET_ID" \
            "$CI_PASSED_FLAG" \
            --pr-url "$PR_URL" \
            --ci-run-url "$CI_RUN_URL" \
            --branch "$BRANCH" || true
