name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      ticket_id:
        description: "Notion ticket ID to sync QA result to (leave empty to skip)"
        required: false
        default: ""

jobs:
  validate:
    name: Validate JSON files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JSON syntax
        id: validate
        run: |
          echo "Validating workflow.json..."
          python -m json.tool workflow.json > /dev/null
          echo "Validating portfolio.json..."
          python -m json.tool portfolio.json > /dev/null
          echo "Validating watchlist.json..."
          python -m json.tool watchlist.json > /dev/null
          echo "All JSON files valid."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -q

      - name: Sync QA result to Notion
        if: always()
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DB_TICKETS_ID: ${{ secrets.NOTION_DB_TICKETS_ID }}
          NOTION_DB_SPECS_ID: ${{ secrets.NOTION_DB_SPECS_ID }}
          TELEGRAM_ORCHESTRATION_BOT_TOKEN: ${{ secrets.TELEGRAM_ORCHESTRATION_BOT_TOKEN }}
          TELEGRAM_ORCHESTRATION_CHAT_ID: ${{ secrets.TELEGRAM_ORCHESTRATION_CHAT_ID }}
        run: |
          # .ticket-id written by the Dispatcher takes precedence over workflow_dispatch input.
          TICKET_ID=$(cat .ticket-id 2>/dev/null || echo "")
          if [ -z "$TICKET_ID" ]; then
            TICKET_ID="${{ inputs.ticket_id }}"
          fi
          if [ -z "$TICKET_ID" ]; then
            echo "No ticket_id found — skipping Notion sync"
            exit 0
          fi

          PR_URL="${{ github.event.pull_request.html_url }}"
          CI_RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BRANCH="${{ github.head_ref || github.ref_name }}"

          pip install "git+https://${{ secrets.GH_PAT }}@github.com/patw47/orchestration.git" --quiet

          if [ "${{ steps.validate.outcome }}" = "success" ]; then
            python -m orchestration.qa_sync \
              --ticket-id "$TICKET_ID" \
              --ci-passed \
              --pr-url "$PR_URL" \
              --ci-run-url "$CI_RUN_URL" \
              --branch "$BRANCH" || true
          else
            python -m orchestration.qa_sync \
              --ticket-id "$TICKET_ID" \
              --no-ci-passed \
              --pr-url "" \
              --ci-run-url "$CI_RUN_URL" \
              --branch "$BRANCH" || true
          fi
