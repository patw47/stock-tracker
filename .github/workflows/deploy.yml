name: Deploy to VPS

# Déclenché à la fin de la CI sur main. Déploie seulement si la CI est verte
# ET si "Notify PR merge conflicts" est vert sur le même commit.
# Tourne sur un runner self-hosted INSTALLÉ SUR LE VPS : le déploiement s'exécute
# en local (pas de SSH depuis le cloud — le VPS bloque le trafic retour des runners GitHub).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Pas de déploiements concurrents (écriture sqlite + restart de services).
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted]
    # le run manuel de validation (n8n execute) prend ~4-6 min pour 15 tickers.
    timeout-minutes: 20
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      REPO_DIR: /opt/apps/stock-tracker
    steps:
      - name: Gate — "Notify PR merge conflicts" vert sur ce commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Commit ciblé : $HEAD_SHA"
          api="https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=$HEAD_SHA&per_page=100"
          ok=""
          for i in $(seq 1 10); do
            concl=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api" \
              | python3 -c "import sys,json;d=json.load(sys.stdin);print(next((r['conclusion'] for r in d['workflow_runs'] if r['name']=='Notify PR merge conflicts'),''))")
            echo "tentative $i — conflits: ${concl:-<en cours>}"
            if [ "$concl" = "success" ]; then ok=1; break; fi
            case "$concl" in
              failure|cancelled|timed_out)
                echo "::error::workflow conflits non vert ($concl) — déploiement bloqué"; exit 1;;
            esac
            sleep 20
          done
          if [ -z "$ok" ]; then
            echo "::error::workflow conflits pas terminé à temps — déploiement bloqué"; exit 1
          fi

      - name: Déployer (local, sur le VPS)
        id: deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          git config --global --add safe.directory "$REPO_DIR" || true
          # extraheader : authentifie le fetch (repo privé) sans dépendre des creds du VPS.
          git -C "$REPO_DIR" -c http.extraheader="AUTHORIZATION: bearer $GH_TOKEN" fetch --prune origin
          git -C "$REPO_DIR" reset --hard origin/main
          out=$(bash "$REPO_DIR/deploy/remote.sh" 2>&1)
          rc=$?
          echo "$out"
          get() { echo "$out" | grep -E "^$1=" | tail -n1 | cut -d= -f2; }
          {
            echo "stock_tracker=$(get STATUS_STOCK_TRACKER)"
            echo "warren=$(get STATUS_WARREN)"
            echo "n8n_health=$(get STATUS_N8N_HEALTH)"
            echo "overall=$(get STATUS_OVERALL)"
          } >> "$GITHUB_OUTPUT"
          overall=$(get STATUS_OVERALL)
          if [ "$rc" -ne 0 ] || [ "${overall:-fail}" != "ok" ]; then
            exit 1
          fi

      - name: Notifier Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_ORCHESTRATION_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_ORCHESTRATION_CHAT_ID }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
        run: |
          set -uo pipefail
          st="${{ steps.deploy.outputs.stock_tracker }}"
          wr="${{ steps.deploy.outputs.warren }}"
          hl="${{ steps.deploy.outputs.n8n_health }}"
          ov="${{ steps.deploy.outputs.overall }}"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$ov" = "ok" ]; then
            emoji="✅"; title="déploiement effectif — systèmes redémarrés"
          else
            emoji="❌"; title="problème de déploiement"
          fi
          icon() { if [ "$1" = "active" ] || [ "$1" = "ok" ]; then echo "🟢"; else echo "🔴"; fi; }

          text=$(printf '%s\n' \
            "$emoji ${PROJECT_NAME} — ${title}" \
            "service stock-tracker: $(icon "${st:-?}") ${st:-inconnu}" \
            "agent warren: $(icon "${wr:-?}") ${wr:-inconnu}" \
            "n8n health: $(icon "${hl:-?}") ${hl:-inconnu}" \
            "commit: ${HEAD_SHA:0:7}" \
            "$run_url")

          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${text}" \
            -d "disable_web_page_preview=true" >/dev/null
