name: Deploy to VPS

# Déclenché à la fin de la CI sur main. Déploie seulement si la CI est verte
# ET si "Notify PR merge conflicts" est vert sur le même commit.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Pas de déploiements concurrents (écriture sqlite + restart de services).
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # le run manuel de validation (n8n execute) prend ~4-6 min pour 15 tickers.
    timeout-minutes: 20
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Gate — "Notify PR merge conflicts" vert sur ce commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Commit ciblé : $HEAD_SHA"
          ok=""
          for i in $(seq 1 10); do
            concl=$(gh api \
              "repos/${{ github.repository }}/actions/runs?head_sha=$HEAD_SHA&per_page=100" \
              --jq '.workflow_runs[] | select(.name=="Notify PR merge conflicts") | .conclusion' \
              | head -n1 || true)
            echo "tentative $i — conflits: ${concl:-<en cours>}"
            if [ "$concl" = "success" ]; then ok=1; break; fi
            if [ "$concl" = "failure" ] || [ "$concl" = "cancelled" ] || [ "$concl" = "timed_out" ]; then
              echo "::error::workflow conflits non vert ($concl) — déploiement bloqué"
              exit 1
            fi
            sleep 20
          done
          if [ -z "$ok" ]; then
            echo "::error::workflow conflits pas terminé à temps — déploiement bloqué"
            exit 1
          fi

      - name: Configurer la clé SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          # tr -d '\r' : la clé peut arriver avec des CRLF (copier-coller Windows) -> format invalide.
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_vps
          chmod 600 ~/.ssh/id_vps
          # trim espaces/CR éventuels du host (copier-coller Windows).
          host=$(printf '%s' "$VPS_SSH_HOST" | tr -d '[:space:]')
          ssh-keyscan -H "$host" >> ~/.ssh/known_hosts 2>/dev/null || true
          # sanity check du format de clé (n'affiche pas la clé).
          if ! ssh-keygen -y -f ~/.ssh/id_vps >/dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY illisible (mauvais format ou passphrase). Doit être une clé privée OpenSSH sans passphrase."
            exit 1
          fi
          # empreinte (non secrète) — à comparer avec id_ed25519_vps.pub dans authorized_keys du VPS.
          echo "[deploy.yml] fingerprint clé déployée :"
          ssh-keygen -lf ~/.ssh/id_vps

      - name: Déployer sur le VPS
        id: deploy
        env:
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
        run: |
          set -uo pipefail
          # trim espaces/CR éventuels (copier-coller Windows -> "hostname contains invalid characters").
          host=$(printf '%s' "$VPS_SSH_HOST" | tr -d '[:space:]')
          user=$(printf '%s' "$VPS_SSH_USER" | tr -d '[:space:]')
          # set +e local : on veut capturer le code retour ssh sans que bash -e tue le step.
          set +e
          # KexAlgorithms classique : le KEX post-quantique (sntrup761) envoie un gros
          # paquet qui se fait blackholer (MTU) entre le runner GitHub et le VPS -> hang.
          out=$(ssh -i ~/.ssh/id_vps \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o KexAlgorithms=curve25519-sha256@libssh.org,curve25519-sha256,diffie-hellman-group14-sha256 \
            "${user}@${host}" '
              set -e
              git -C /opt/apps/stock-tracker fetch --prune origin
              git -C /opt/apps/stock-tracker reset --hard origin/main
              bash /opt/apps/stock-tracker/deploy/remote.sh
            ' 2>&1)
          rc=$?
          echo "$out"
          echo "[deploy.yml] ssh exit code = $rc"
          get() { echo "$out" | grep -E "^$1=" | tail -n1 | cut -d= -f2; }
          {
            echo "stock_tracker=$(get STATUS_STOCK_TRACKER)"
            echo "warren=$(get STATUS_WARREN)"
            echo "n8n_health=$(get STATUS_N8N_HEALTH)"
            echo "trigger=$(get STATUS_TRIGGER)"
            echo "overall=$(get STATUS_OVERALL)"
          } >> "$GITHUB_OUTPUT"
          overall=$(get STATUS_OVERALL)
          if [ "$rc" -ne 0 ] || [ "${overall:-fail}" != "ok" ]; then
            exit 1
          fi

      - name: Notifier Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_ORCHESTRATION_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_ORCHESTRATION_CHAT_ID }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
        run: |
          set -uo pipefail
          st="${{ steps.deploy.outputs.stock_tracker }}"
          wr="${{ steps.deploy.outputs.warren }}"
          hl="${{ steps.deploy.outputs.n8n_health }}"
          tr="${{ steps.deploy.outputs.trigger }}"
          ov="${{ steps.deploy.outputs.overall }}"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$ov" = "ok" ]; then
            emoji="✅"; title="déploiement réussi"
          else
            emoji="❌"; title="problème de déploiement"
          fi
          icon() { if [ "$1" = "active" ] || [ "$1" = "ok" ]; then echo "🟢"; else echo "🔴"; fi; }

          text=$(printf '%s\n' \
            "$emoji ${PROJECT_NAME} — ${title}" \
            "service stock-tracker: $(icon "${st:-?}") ${st:-inconnu}" \
            "agent warren: $(icon "${wr:-?}") ${wr:-inconnu}" \
            "n8n health: $(icon "${hl:-?}") ${hl:-inconnu}" \
            "run manuel: $(icon "${tr:-?}") ${tr:-inconnu}" \
            "commit: ${HEAD_SHA:0:7}" \
            "$run_url")

          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${text}" \
            -d "disable_web_page_preview=true" >/dev/null
